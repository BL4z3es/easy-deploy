# Remote Manager's deploy/deploy.sh and install.sh, as an easy-deploy config.
#
#   original                                    here
#   venv/ rebuilt if missing, pip on change     STACK=python (installer.py, env/)
#   restart remote-manager                      SERVICES
#   /healthz direct, / and /js/app.js via Caddy HEALTH_URLS, health_check
#   drift: unit, fragment, Caddyfile import     built in
#   install: config.toml, Pillow, vendor checks on_install
#   install: tailscale cert, TS_PERMIT_CERT_UID keep that part of install.sh as
#                                               deploy/tailscale-https.sh, run by hand
#
# Moves to make in the repository alongside it:
#   - the venv is env/, installer.py's, not venv/: ExecStart in
#     deploy/remote-manager.service becomes /srv/rm/env/bin/python -m app.main
#   - Pillow goes into requirements.txt; installer.py installs what is listed
#
# The unit runs as root (it owns terminals); SERVICE_USER is the account that
# owns the checkout and runs deploys, which is never root.

NAME=remote-manager
SERVICE_USER=bl4z3
PREFIX=/srv/rm
BRANCH=main

STACK=python
# Imported, not run with --check: deploys run as SERVICE_USER, and the real
# config is root's alone. CI checks the config template on its own.
PY_CHECK="-c 'import app.main'"

PORT=8787
SITE=racknerd-vps.taila90cd3.ts.net
WRITABLE_DIRS=""

# uvicorn is up and the config loaded (a bad config is a hard startup failure).
HEALTH_URLS="http://127.0.0.1:8787/healthz"

# The page and its static tree, through Caddy, as the site's own name: HTTPS
# on the ts.net name, or the plain-HTTP site on the tailnet address before the
# certificate is in place.
health_check() {
    local path code
    for path in / /js/app.js; do
        code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                --resolve "racknerd-vps.taila90cd3.ts.net:443:127.0.0.1" \
                "https://racknerd-vps.taila90cd3.ts.net$path" || true)"
        if [[ "$code" != 200 ]]; then
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "Host: 100.85.135.39" \
                    --max-time 5 "http://127.0.0.1$path" || true)"
        fi
        [[ "$code" == 200 ]] || { warn "$path through Caddy: $code"; return 1; }
    done
}

on_install() {
    # Root-only: the config holds the passphrase hash for a daemon that runs
    # as root. Never overwritten once it exists.
    install -d -m 0700 -o root -g root /etc/remote-manager
    install -d -m 0755 -o root -g root /etc/remote-manager/apps.d
    if [[ ! -f /etc/remote-manager/config.toml ]]; then
        warn "No /etc/remote-manager/config.toml: create it from deploy/config.vps.toml"
        warn "(python tools/hash_passphrase.py for the hash), then re-run install.sh."
        return 1
    fi
    chmod 600 /etc/remote-manager/config.toml
    local lib
    for lib in xterm.js cm/codemirror-view.js pdfjs/pdf.min.mjs; do
        [[ -s "$PREFIX/app/static/vendor/$lib" ]] || warn "app/static/vendor/$lib is missing (deploy/fetch-vendor.sh)."
    done
}
