# ai4rc-homepage's deploy/deploy.sh and install.sh, as an easy-deploy config.
#
#   original                                    here
#   env/ rebuilt if missing, pip on change      STACK=python (installer.py)
#   restart ai4rc-homepage                      SERVICES (the default: NAME)
#   GET /health, / and /app, 15s                HEALTH_URLS, HEALTH_HOST
#   drift: unit, fragment, Caddyfile import     built in
#   install: data/ 0750                         WRITABLE_DIRS
#   install: the Caddy site, validated          deploy/ai4rc-homepage.caddy, SITE

NAME=ai4rc-homepage
SERVICE_USER=bl4z3
PREFIX=/srv/ai4rc-homepage
BRANCH=main

STACK=python
# main.py builds the FastAPI app at import; importing it is the whole check.
PY_CHECK="-c 'import main'"

PORT=8011
SITE=ai4rc.nebula-studios.net
WRITABLE_DIRS="data"
ENV_FILE=-/etc/ai4rc-homepage.env

# /health proves uvicorn is up, / that index.html is served, /app that the
# workspace opened its database -- the one thing here that can fail on the
# server and not on a laptop. All GET: FastAPI answers HEAD with 405.
HEALTH_URLS="http://127.0.0.1:8011/health http://127.0.0.1:8011/ http://127.0.0.1:8011/app"
HEALTH_HOST=ai4rc.nebula-studios.net
