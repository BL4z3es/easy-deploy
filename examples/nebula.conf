# Nebula's deploy/deploy.sh, as an easy-deploy config. The reference: every
# behaviour of the original is here, step for step.
#
#   original deploy.sh                          here
#   pip install when requirements.txt moved     STACK=python (installer.py)
#   load_env /etc/nebula/nebula.env             ENV_FILE
#   migrate, Judgement's migrate, collectstatic before_restart
#   systemctl restart nebula                    SERVICES (the default: NAME)
#   restart judgement-worker if enabled, warn   OPTIONAL_SERVICES
#   curl / with Host: nebula-studios.net, 15s   HEALTH_URLS, HEALTH_HOST, HEALTH_TRIES
#   manage.py check_database after the 200      health_check
#
# Kept as it is: deploy/nebula.service and deploy/judgement-worker.service.
# Not managed: deploy/Caddyfile. Nebula owns /etc/caddy/Caddyfile itself, so
# there is no deploy/nebula.caddy fragment and no SITE.

NAME=nebula
SERVICE_USER=bl4z3
PREFIX=/srv/nebula
BRANCH=main

STACK=python
# Django's system check imports every installed app: a missing package fails
# here, before the restart, instead of in the health check after it.
PY_CHECK="Nebula/manage.py check"

OPTIONAL_SERVICES="judgement-worker"
PORT=8001
# The application writes all over /srv/nebula (ReadWritePaths in the unit),
# so there is nothing extra for install.sh to create.
WRITABLE_DIRS=""
ENV_FILE=/etc/nebula/nebula.env

HEALTH_URLS="http://127.0.0.1:8001/"
HEALTH_HOST=nebula-studios.net
HEALTH_TRIES=15

before_restart() {
    cd Nebula
    log "Running migrations"
    "$PY" manage.py migrate --noinput

    # Judgement keeps its data in its own PostgreSQL database, which a bare
    # migrate never touches. Skipped until the env file names that database,
    # and on a commit without the app, so neither a server not yet set up nor
    # a rollback past the app can fail here.
    if [[ -n "${JUDGEMENT_DB_NAME:-}" && -d Judgement ]]; then
        log "Running Judgement's migrations"
        "$PY" manage.py migrate Judgement --database judgement --noinput
    fi

    log "Collecting static files"
    "$PY" manage.py collectstatic --noinput --clear | tail -1
}

health_check() {
    # / never touches the database, so a 200 says nothing about which one the
    # site is on or whether it holds anything. Skipped on a commit without the
    # command, so a rollback past it is still judged by HTTP.
    [[ -f Nebula/Core/management/commands/check_database.py ]] || return 0
    cd Nebula
    "$PY" manage.py check_database
}
