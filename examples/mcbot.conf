# mcbot's deploy/deploy.sh and install.sh, as an easy-deploy config.
#
#   original                                    here
#   npm ci when package*.json moved             STACK=node
#   restart mcbot (disconnects the fleet)       SERVICES (the default: NAME)
#   curl / with Host, up to 150s                HEALTH_URLS, HEALTH_HOST, HEALTH_TRIES
#   drift: mcbot.service, mcbot.caddy           built in
#   install: data/ logs/ assets/                WRITABLE_DIRS
#   install: node >= 22, settings-init.js       on_install
#
# Two changes to make in the repository alongside it:
#   - deploy/mcbot.service is installed as it is now, not rendered. Write the
#     node path into it (its ExecStart and ExecStartPre say /usr/bin/node);
#     with a node from NodeSource that is already right.
#   - the workflow's deploy job needs  with: { timeout-minutes: 20 }  -- the
#     ExecStartPre can wait two minutes for the game server, and the health
#     check up to 150s on top.

NAME=mcbot
SERVICE_USER=bl4z3
PREFIX=/srv/mcbot
BRANCH=main

STACK=node

PORT=8800
SITE=fleet.nebula-studios.net
# data/ holds the roster, the groups and the dashboard token, all written by
# the running fleet: gitignored, so the reset never touches it.
WRITABLE_DIRS="data logs assets"

HEALTH_URLS="http://127.0.0.1:8800/"
HEALTH_HOST=fleet.nebula-studios.net
# Generous, and for a reason: the unit's second ExecStartPre waits up to 120s
# for the *game* server before node starts, so a deploy landing while it is
# down is a slow deploy, not a failed one.
HEALTH_TRIES=150

on_install() {
    # mineflayer and minecraft-protocol declare node >= 22; Debian 12 and
    # Ubuntu 24.04 ship 18.
    local major
    major="$(node -p 'process.versions.node.split(".")[0]')"
    if (( major < 22 )); then
        warn "node $major is too old: curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -"
        return 1
    fi
    # Settings: bind address and dashboard token, never replacing a token
    # already set. Prints TOKEN|STATUS.
    local out
    out="$(asuser node "$PREFIX/deploy/settings-init.js" "$PREFIX/data/settings.json" "${MCBOT_BIND:-127.0.0.1}" "${MCBOT_TOKEN:-}")"
    chmod 0640 "$PREFIX/data/settings.json"
    log "dashboard token ${out##*|}: ${out%%|*}"
}
