# easy-deploy settings for @NAME@.
#
# Read by deploy/deploy.sh on every deploy, and by deploy/install.sh. Plain
# bash, sourced: assignments and functions only, nothing that does work when
# the file is loaded. `deploy/deploy.sh --print-config` shows what it resolves to.
#
# deploy.sh loads this file from each commit it applies, so a commit's hooks
# and health checks deploy -- and roll back -- together with its code. NAME,
# PREFIX, BRANCH, SERVICE_USER and STATE_DIR are the exception: changing one
# of them is an install, so a deploy keeps the ones already in place and says so.

# --- identity ----------------------------------------------------------------

# The unit, the sudoers file and the Caddy fragment are all named after it.
NAME=@NAME@
# Owns PREFIX, runs the service, runs deploy.sh. Never root.
SERVICE_USER=@USER@
# The deploy root: a mirror of origin/BRANCH, reset on every deploy.
PREFIX=@PREFIX@
BRANCH=@BRANCH@
# Deploy log, lock, and the record of what is deployed. Default: $PREFIX/.easy-deploy
# STATE_DIR=

# --- dependencies ------------------------------------------------------------

# python: installer.py builds env/ and installs requirements.txt into it
# node:   npm ci --omit=dev
# none:   nothing -- or define install_deps below and list its DEPS_FILES
# Installed only when DEPS_FILES changed since they were last installed, or
# when they are missing.
STACK=@STACK@
# Default: requirements.txt for python; package.json package-lock.json for node.
# DEPS_FILES=""
# The interpreter that builds env/. Default: python3
# PYTHON=python3
@PY_CHECK_LINE@
# Prepended to the bare PATH a forced command gets, for a node or python
# that is not in /usr/bin.
# EXTRA_PATH=/opt/node22/bin

# --- the service -------------------------------------------------------------

# The units deploy.sh restarts and health-checks, in order. Default: $NAME
# SERVICES="@NAME@"
# Units restarted after them when enabled -- a worker beside the site. One
# that fails to restart is reported, never rolled back over.
# OPTIONAL_SERVICES=""
# The loopback port the application listens on.
PORT=@PORT@
@SITE_LINE@
# Directories the service writes, created by install.sh and owned by
# SERVICE_USER. Keep them gitignored: the reset leaves untracked paths alone.
WRITABLE_DIRS="data"
# Read -- never sourced -- before the hooks run, so they see the same secrets
# the unit does. A leading - means optional, as in systemd.
# ENV_FILE=-/etc/@NAME@/@NAME@.env

# --- health ------------------------------------------------------------------

# Healthy: every unit in SERVICES is active, and every URL answers
# HEALTH_STATUS within HEALTH_TRIES seconds; then the health_check hook.
HEALTH_URLS="http://127.0.0.1:@PORT@/"
# Sent as the Host header, for an application that checks it.
# HEALTH_HOST=@SITE_OR_EXAMPLE@
# HEALTH_STATUS=200
# HEALTH_TRIES=15

# --- hooks -------------------------------------------------------------------
#
# Each runs from the deploy root in a bash of its own with `set -euo pipefail`,
# so its first failing command fails the deploy and rolls it back. Available:
# $REPO $PREFIX $NAME $PY (env/'s python) $VENV $ED_REF (the commit being
# applied) $ED_PHASE (deploy or rollback), ENV_FILE's variables, log, warn.
#
# After dependencies, before the restart:
# before_restart() {
#     "$PY" manage.py migrate --noinput
# }
#
# After the restart, before the health check:
# after_restart() {
#     "$PY" manage.py clearsessions
# }
#
# Once every URL answers. Fail it to roll back:
# health_check() {
#     "$PY" manage.py check --database default
# }
#
# Replaces the STACK's own dependency step:
# install_deps() {
#     make build
# }
#
# install.sh only, as root, before the units start:
# on_install() {
#     install -d -o "$SERVICE_USER" -m 0750 /var/lib/@NAME@
# }
